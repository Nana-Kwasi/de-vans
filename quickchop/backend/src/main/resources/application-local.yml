# Local dev profile: in-memory H2, no Supabase/Paystack/FCM needed.
# Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=local
# Flyway is disabled here (migrations are Postgres-specific); Hibernate creates
# the schema and LocalDataSeeder inserts the admin + the 3 menu items.
spring:
  datasource:
    url: jdbc:h2:mem:quickchop;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
  # In local mode we don't validate real Supabase JWTs (no project yet).
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URI:https://example.supabase.co/auth/v1/.well-known/jwks.json}
