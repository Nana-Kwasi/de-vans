quickchop:
  business-name: ${BUSINESS_NAME:Qooka Qooks Restaurant}
  delivery-fee: ${DELIVERY_FEE:0.00}   # flat fallback when no coords are sent
  # Restaurant origin — Anyaa Last Stop, Accra. Delivery distance/fee are
  # measured from here. Override per-environment with STORE_LAT / STORE_LNG.
  store:
    lat: ${STORE_LAT:5.6072}
    lng: ${STORE_LNG:-0.2838}
  delivery:
    base-fee: ${DELIVERY_BASE_FEE:10.00}
    per-km: ${DELIVERY_PER_KM:4.00}
    max-fee: ${DELIVERY_MAX_FEE:120.00}
    # Straight-line distance x this = approximate driving distance. Accra roads run
    # about a third longer than the crow flies; raise it if quoted fees still come in
    # under what deliveries actually cost.
    road-factor: ${DELIVERY_ROAD_FACTOR:1.35}
  riders:
    # Deliveries one rider may hold at once. 1 keeps it simple: finish, then take the next.
    max-active-deliveries: ${RIDER_MAX_ACTIVE_DELIVERIES:1}
    # Rider must enter the customer's 4-digit code to complete a delivery (proof of delivery).
    require-delivery-pin: ${RIDER_REQUIRE_PIN:true}
  rate-limit:
    # Trusted proxies that append to X-Forwarded-For: 1 on Cloud Run, 0 if hit directly.
    proxy-hops: ${RATE_LIMIT_PROXY_HOPS:1}
    general-per-minute: ${RATE_LIMIT_PER_MINUTE:300}
    # Sign-in attempts per IP per minute (admin + rider), on top of the per-account lockout.
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:10}
  cors:
    # Comma-separated browser origins allowed to call the API. Blank means
    # "any origin", which is what local development wants. Set it on Cloud Run
    # once the admin dashboard has a URL. The mobile app sends no Origin header,
    # so this never affects it.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

spring:
  application:
    name: quickchop-backend

  servlet:
    multipart:
      max-file-size: 60MB
      # A little above max-file-size to leave room for multipart encoding overhead.
      max-request-size: 65MB

  # Default profile targets Supabase Postgres (via the connection pooler + SSL).
  # Use --spring.profiles.active=local to run against in-memory H2 instead.
  # SSL and pooler-specific driver options (sslmode, prepareThreshold) live in the
  # SUPABASE_DB_URL query string (see .env.example) so they never touch the H2
  # local profile, which overrides this datasource entirely.
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/quickchop}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Keep the pool small — Supabase's pooler multiplexes connections for you.
      maximum-pool-size: ${DB_POOL_SIZE:8}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Supabase JWKS endpoint — Spring validates customer JWTs against this.
          jwk-set-uri: ${SUPABASE_JWKS_URI:https://YOUR-PROJECT.supabase.co/auth/v1/.well-known/jwks.json}
          issuer-uri: ${SUPABASE_ISSUER_URI:https://YOUR-PROJECT.supabase.co/auth/v1}
          # Supabase signs access tokens with ES256; without this Spring only
          # accepts RS256 (its default for jwk-set-uri) and rejects every token.
          jws-algorithms:
            - ES256
            - RS256

  # Mail. MAIL_HOST blank (the default) disables sending entirely: EmailService logs
  # what it would have sent and no request fails because of it, which is what local
  # development and any deploy without SMTP credentials want.
  #
  # Gmail needs an APP PASSWORD (Google account -> 2-Step Verification -> App
  # passwords), not the account password, and `app.mail.from` must be the
  # authenticated mailbox — Gmail rewrites or rejects a From it does not own, which
  # reads to the recipient as delivered-then-spam.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Without these a dead SMTP host hangs the request thread until the OS
          # gives up, turning a mail outage into an app outage.
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# Supabase (Storage for meal images; URL/JWKS for auth are under spring.security above)
supabase:
  url: ${SUPABASE_URL:https://YOUR-PROJECT.supabase.co}
  # Service-role key — server-only secret, bypasses Storage RLS for uploads. Never expose to clients.
  service-key: ${SUPABASE_SERVICE_KEY:}
  storage:
    bucket: ${SUPABASE_BUCKET:menu-images}

# App-specific secrets & integrations (all from env vars — never hardcode)
admin:
  jwt:
    secret: ${ADMIN_JWT_SECRET:change-me-in-env-must-be-at-least-32-bytes-long-secret}
    expiry-minutes: ${ADMIN_JWT_EXPIRY_MINUTES:720}

rider:
  jwt:
    # Blank = derived from ADMIN_JWT_SECRET (still a different key). Set it to rotate
    # rider sessions independently of admin ones.
    secret: ${RIDER_JWT_SECRET:}
    expiry-minutes: ${RIDER_JWT_EXPIRY_MINUTES:720}

paystack:
  secret-key: ${PAYSTACK_SECRET_KEY:sk_test_replace_me}
  base-url: ${PAYSTACK_BASE_URL:https://api.paystack.co}
  # Checkout channels. Mobile money only: Paystack otherwise offers every channel
  # enabled on the account, and a card tab the business does not accept just produces
  # failed checkouts. Comma separated, e.g. "mobile_money,card" to widen it.
  channels: ${PAYSTACK_CHANNELS:mobile_money}

fcm:
  # Path to the Firebase service-account JSON, or leave blank to disable push in dev.
  credentials-path: ${FCM_CREDENTIALS_PATH:}

app:
  mail:
    from: ${MAIL_FROM:}
    # Where new support tickets are announced.
    support-inbox: ${SUPPORT_INBOX:}
  # Base URL of the admin dashboard, used to build password-reset links.
  admin-url: ${ADMIN_APP_URL:http://localhost:5173}
  password-reset:
    expiry-minutes: ${PASSWORD_RESET_EXPIRY_MINUTES:60}

# Actuator: health only, no details. This is the endpoint Cloud Run's probe and the
# deploy script hit, and it is the one actuator path SecurityConfig leaves public —
# exposing the rest (env, beans, configprops) would leak configuration to the internet.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# Swagger publishes the whole API surface, admin and rider routes included. Set
# SWAGGER_ENABLED=false in production.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html

server:
  port: ${PORT:8080}

logging:
  level:
    org.springframework.security: INFO
